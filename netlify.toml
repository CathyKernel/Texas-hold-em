# Netlify deployment configuration for GTO Poker Lab.
#
# The app is a fully client-side Next.js build (no API routes, no SSR data),
# so it is deployed as a static export: `next build` with output: "export"
# (activated automatically in next.config.ts when NETLIFY=true) emits the
# site into ./out, which Netlify publishes to its CDN.

[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Long-term caching for hashed static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon and icons
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
